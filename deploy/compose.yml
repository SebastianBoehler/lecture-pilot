x-api-build: &api-build
  context: ..
  dockerfile: apps/api/Dockerfile
  args:
    LECTUREPILOT_COMMIT_SHA: ${LECTUREPILOT_COMMIT_SHA:?Set the deployed Git commit SHA}

x-api-image: &api-image lecturepilot-api:${LECTUREPILOT_COMMIT_SHA:?Set the deployed Git commit SHA}

x-api-environment: &api-environment
  DATABASE_URL: postgresql://lecturepilot:${LECTUREPILOT_POSTGRES_PASSWORD:?Set a strong database password}@db:5432/lecturepilot
  LECTUREPILOT_ENV: production
  LECTUREPILOT_AUTH_MODE: session
  LECTUREPILOT_ALLOWED_ORIGINS: https://${LECTUREPILOT_DOMAIN:?Set the public HTTPS hostname}
  LECTUREPILOT_ALLOWED_HOSTS: ${LECTUREPILOT_DOMAIN:?Set the public HTTPS hostname}
  LECTUREPILOT_SESSION_COOKIE_SECURE: "true"
  LECTUREPILOT_SESSION_COOKIE_SAMESITE: lax
  LECTUREPILOT_HSTS_ENABLED: "true"
  LECTUREPILOT_WORKSPACE_ROOT: /app/storage
  LECTUREPILOT_MAX_REQUEST_BYTES: ${LECTUREPILOT_MAX_REQUEST_BYTES:-629145600}
  LECTUREPILOT_RATE_LIMIT_ENABLED: "true"
  LECTUREPILOT_BOUNDED_PROCESSING: "true"
  # One bounded PDF worker (768 MB address-space cap) fits beside the API inside its 1 GB limit.
  LECTUREPILOT_PROCESSING_WORKERS: "1"
  LECTUREPILOT_LATEX_COMPILER_URL: http://latex-compiler:8080
  LECTUREPILOT_DOCUMENT_CONVERTER_URL: http://document-converter:8080
  LECTUREPILOT_MODEL: ${LECTUREPILOT_MODEL:?Set the production model}
  LECTUREPILOT_ALLOWED_MODELS: ${LECTUREPILOT_ALLOWED_MODELS:?Set the model allowlist}
  LECTUREPILOT_OBSERVABILITY: logging
  LECTUREPILOT_TRACE_CONTENT: metadata
  LECTUREPILOT_METADATA_LOG_PATH: /app/logs/api-metadata.jsonl
  LECTUREPILOT_COMMIT_SHA: ${LECTUREPILOT_COMMIT_SHA:?Set the deployed Git commit SHA}

services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Caddy.Dockerfile
    environment:
      LECTUREPILOT_DOMAIN: ${LECTUREPILOT_DOMAIN:?Set the public HTTPS hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - lecturepilot-caddy-data:/data
      - lecturepilot-caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m

  api:
    image: *api-image
    build: *api-build
    env_file:
      - ../.env.production
    environment: *api-environment
    expose: ["8000"]
    volumes:
      - lecturepilot-api-logs:/app/logs
      - lecturepilot-storage:/app/storage
    # The document converter is optional (profile "authoring"); conversions fail with a clear
    # 503 while it is stopped, and readiness does not depend on it.
    depends_on:
      latex-compiler:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - document-converter
      - latex-compiler
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          headers = {'Host': os.environ['LECTUREPILOT_ALLOWED_HOSTS']};
          [urllib.request.urlopen(
            urllib.request.Request('http://127.0.0.1:8000/' + path, headers=headers),
            timeout=2
          ).close() for path in ('health', 'ready')]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    # Sized for one 4 GB / 2 vCPU host: api 1g, latex-compiler 768m, db 512m, gateway 128m,
    # web 96m, plus document-converter 1.5g only while the authoring profile runs.
    mem_limit: 1g
    cpus: 2

  latex-compiler:
    build:
      context: ..
      dockerfile: apps/latex-compiler/Dockerfile
    init: true
    expose: ["8080"]
    environment:
      LECTUREPILOT_METADATA_LOG_PATH: /app/logs/compiler-metadata.jsonl
    volumes:
      - lecturepilot-compiler-logs:/app/logs
    networks:
      - latex-compiler
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    read_only: true
    # tmpfs pages count against mem_limit; keep room for Tectonic itself.
    tmpfs:
      - /tmp:size=384m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 768m
    cpus: 1

  document-converter:
    # Only needed while professors build courses (DOCX/PPTX/XLSX normalization and OCR):
    #   docker compose --profile authoring up -d document-converter
    #   docker compose stop document-converter
    profiles: [authoring]
    build:
      context: ..
      dockerfile: apps/document-converter/Dockerfile
    expose: ["8080"]
    environment:
      LECTUREPILOT_OCR_URL: ${LECTUREPILOT_OCR_URL:-}
      # Recognizes image-only slides and pages in-process on the CPU (small PP-OCR models
      # baked into the image). Set to an empty value to disable; see docs/self-hosting.md.
      LECTUREPILOT_OCR_ENGINE: ${LECTUREPILOT_OCR_ENGINE-rapidocr}
    networks:
      - document-converter
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1536m
    # OCR sizes its ONNX thread pool from this quota: 1.5 CPUs -> one OCR thread, leaving
    # the API responsive on a 2 vCPU host.
    cpus: 1.5

  preflight:
    image: *api-image
    build: *api-build
    command:
      [
        python,
        -m,
        lecturepilot.production_preflight,
        --env-file,
        /dev/null,
        --require-build-identity,
      ]
    env_file:
      - ../.env.production
    environment:
      <<: *api-environment
      LECTUREPILOT_DOMAIN: ${LECTUREPILOT_DOMAIN:?Set the public HTTPS hostname}
      LECTUREPILOT_POSTGRES_PASSWORD: ${LECTUREPILOT_POSTGRES_PASSWORD:?Set a strong database password}
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  migrate:
    image: *api-image
    build: *api-build
    command: [alembic, -c, apps/api/alembic.ini, upgrade, head]
    environment: *api-environment
    depends_on:
      preflight:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  db:
    build:
      context: ..
      dockerfile: deploy/Postgres.Dockerfile
    environment:
      POSTGRES_DB: lecturepilot
      POSTGRES_USER: lecturepilot
      POSTGRES_PASSWORD: ${LECTUREPILOT_POSTGRES_PASSWORD:?Set a strong database password}
    expose: ["5432"]
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
    volumes:
      - lecturepilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U lecturepilot -d lecturepilot]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Default shared_buffers (128 MB) plus per-connection work memory.
    mem_limit: 512m

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        LECTUREPILOT_COMMIT_SHA: ${LECTUREPILOT_COMMIT_SHA:?Set the deployed Git commit SHA}
    expose: ["80"]
    volumes:
      - ../docs/onboarding-media:/srv/lecturepilot-media:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=4m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m

volumes:
  lecturepilot-api-logs:
  lecturepilot-caddy-config:
  lecturepilot-caddy-data:
  lecturepilot-compiler-logs:
  lecturepilot-postgres:
  lecturepilot-storage:

networks:
  document-converter:
    internal: true
  latex-compiler:
    internal: true
